# ============================================================
#  我的博客 · 站点配置
#  改完保存，本地预览会自动刷新，不用重启
# ============================================================

# ---------- 基础 ----------
theme = "blowfish"

# 站点网址。结尾的斜杠不能少，canonical 和 RSS 都按它拼。
baseURL = "https://stlara-f.github.io/"

# 站点标题、简介、作者介绍这些随语言变的，都在文件末尾的 [languages] 里各写一份。

# 语言
defaultContentLanguage = "zh-cn"
# 默认语言不放进子目录：中文地址保持 /posts/... 不变，英文自动落到 /en/ 下。
# 反过来会让已上线的中文链接全部搬家。
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

# 站点时区。文章里只写日期（如 2026-09-18）时，按这个时区解释，
# 否则会被当成 UTC 零点，导致当天写的文章被判为“未来”而不显示。
timeZone = "Asia/Shanghai"

# 让搜索引擎可以抓取
enableRobotsTXT = true

# 支持在文章里直接用 emoji，例如 :smile:
enableEmoji = true

# 自动摘要的长度（按词数，中文下影响不大）
summaryLength = 30

# 是否构建草稿 / 未来日期的文章
buildDrafts = false
buildFuture = false

# ---------- 分页 ----------
[pagination]
  pagerSize = 10

# ---------- 分类维度 ----------
[taxonomies]
  tag = "tags"
  category = "categories"
  series = "series"

# ---------- 输出格式 ----------
# home 里的 JSON 是站内搜索的数据源（enableSearch 依赖它）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# ---------- 站点地图 ----------
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

# ============================================================
#  正文解析（Markdown 渲染）
#  表格和代码高亮是 Hugo 默认就有的。下面几项是在默认之上额外要的行为，
#  删掉会退回默认：独立成段的图片被包进 <p>、正文里的 HTML 被转义、
#  \( \) 和 $$ $$ 里的公式不再解析。
# ============================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.parser]
      # 图片单独成段时不包进 <p>（false = 不包）
      wrapStandAloneImageWithinParagraph = false
      # 允许在 Markdown 里给块级元素加 {#id .class} 属性
      [markup.goldmark.parser.attribute]
        block = true

    [markup.goldmark.renderer]
      # 允许在 Markdown 里直接写 HTML，写博客时很有用
      unsafe = true

    # 支持 \( 行内公式 \) 和 $$ 块级公式 $$
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [['\[', '\]'], ['$$', '$$']]
          inline = [['\(', '\)']]

  [markup.highlight]
    # Hugo 默认是 true：把配色直接写死进 HTML。改成 false 才会按 class 引用
    # 主题的高亮样式，明暗两套配色才能各自成立。
    noClasses = false

  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# ============================================================
#  主题参数：外观与功能
# ============================================================
[params]
  # 站点简介随语言变，写在文件末尾的 [languages.<语言>.params] 里。
  # 它用在首页的 <meta name="description">，也是没写 summary 的页面的兜底。

  # 配色方案。可选值：
  # autumn / avocado / bloody / blowfish / burufugu / congo / fire / forest
  # github / marvel / neon / noir / ocean / one-light / princess / slate / terminal
  colorScheme = "blowfish"

  # 默认明暗模式：light 或 dark
  defaultAppearance = "dark"
  # true = 跟随访客系统的明暗设置自动切换
  autoSwitchAppearance = true

  # 站内搜索（快捷键 /）
  enableSearch = true
  # 代码块右上角的复制按钮
  enableCodeCopy = true
  # 面包屑导航
  enableStructuredBreadcrumbs = true

  # 哪些目录算“文章列表”，首页和文章页都会用到
  mainSections = ["posts"]

  # 当前栏目在导航里高亮
  highlightCurrentMenuArea = true
  # 目录跟随滚动高亮
  smartTOC = true

  # 静态资源指纹算法（Hugo 默认 sha256）
  fingerprintAlgorithm = "sha512"

  # 日期显示格式是**分语言**的，写在下面的 [languages.<语言>.params] 里 ——
  # 主题读的是 site.Language.Params.dateFormat，写在顶层会被所有语言继承。

  # ---------- 页头 ----------
  [params.header]
    # basic / fixed / fixed-fill / fixed-gradient / fixed-fill-blur / floating
    layout = "fixed"
    mobileMenuStyle = "dropdown"

  # ---------- 页脚 ----------
  [params.footer]
    showMenu = true
    showCopyright = true
    # 页脚显示主题署名（Blowfish 作者）
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  # ---------- 首页 ----------
  [params.homepage]
    # page（经典博客首页）/ profile（个人名片）/ hero / card / background / landing
    layout = "page"
    showRecent = true
    showRecentItems = 5
    showMoreLink = true
    showMoreLinkDest = "posts"
    cardView = true

  # ---------- 文章页 ----------
  [params.article]
    showDate = true
    showViews = false
    showLikes = false
    showDateUpdated = false
    showAuthor = true
    showHero = false
    showBreadcrumbs = true
    showDraftLabel = true
    showEdit = false
    showHeadingAnchors = true
    showPagination = true
    showReadingTime = true
    showReadingProgress = true
    showTableOfContents = true
    showRelatedContent = true
    relatedContentLimit = 4
    showTaxonomies = true
    showWordCount = true
    showZenMode = true
    # 分享按钮，可选：twitter / email / telegram / whatsapp / linkedin 等
    sharingLinks = []

  # ---------- 列表页 ----------
  [params.list]
    showHero = false
    showBreadcrumbs = false
    showSummary = true
    showTableOfContents = false
    showCards = true
    cardView = true
    # 按年份分组显示
    groupByYear = true

  # ---------- 标签 / 分类总览 ----------
  [params.taxonomy]
    showTermCount = true
    showHero = false
    cardView = false

  # ---------- 单个标签 / 分类页 ----------
  [params.term]
    showHero = false
    groupByYear = true
    cardView = true

  # ---------- 关于你 ----------
  [params.author]
    name = "Stlara-F"
    # 头像放在 assets/img/ 下，这里写相对路径
    image = "img/avatar.svg"
    # headline（一句话介绍）与 bio（简介）随语言变，
    # 写在文件末尾的 [languages.<语言>.params.author] 里。
    # 社交链接。等号左边的名字就是图标名，取值见 themes/blowfish/assets/icons/ 下的文件名。
    links = [
      { github = "https://github.com/Stlara-F" },
    ]

# ============================================================
#  导航菜单
#  菜单上显示的文字不写在这里：它取 pageRef 指向页面的 title。
#  所以中文菜单显示「文章」，英文菜单自动显示 "Posts"。
#  要改菜单文字，就去改那个页面的 title（如 content/posts/_index.md）。
# ============================================================
[menu]
  [[menu.main]]
    pageRef = "posts"
    weight = 10

  [[menu.main]]
    pageRef = "tags"
    weight = 20

  [[menu.main]]
    pageRef = "about"
    weight = 30

  [[menu.footer]]
    pageRef = "tags"
    weight = 10

  [[menu.footer]]
    pageRef = "about"
    weight = 20

# ============================================================
#  多语言
#  加一种语言 = 在这里加一块 + 建对应语言的内容文件（如 index.en.md）。
#  不用改模板或代码。每块的 displayName 是语言切换菜单里显示的名字，必填。
# ============================================================
[languages]
  [languages.zh-cn]
    # locale 决定 <html lang> 与 hreflang 里写的语言代码。它和上面
    # defaultContentLanguage 的 "zh-cn" 大小写不同：键名小写、locale 规范
    # 大小写，两边都不要改（写混了不报错，只是输出悄悄变样）。
    locale = "zh-CN"
    title = "Stlara 的博客"
    weight = 1
    [languages.zh-cn.params]
      displayName = "简体中文"
      description = "这里记录我在技术、阅读和生活里的一些想法。"
      # 主题读的是 site.Language.Params.dateFormat，所以每个语言各写一份。
      # 漏写会退回主题默认的 :date_long（英文格式）。
      dateFormat = "2006年1月2日"
      [languages.zh-cn.params.author]
        headline = "把想明白的东西写下来。"
        bio = "在这里记录学习笔记、技术总结和一些零散的想法。"

  [languages.en]
    locale = "en"
    title = "Stlara's Blog"
    weight = 2
    [languages.en.params]
      displayName = "English"
      description = "Notes on technology, reading, and everyday thoughts."
      dateFormat = "January 2, 2006"
      [languages.en.params.author]
        headline = "Writing down what I have figured out."
        bio = "Study notes, technical write-ups, and scattered thoughts."
